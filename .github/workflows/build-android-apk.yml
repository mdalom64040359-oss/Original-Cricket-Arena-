name: Build Cricket Arena Android Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies and build web bundle
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          npx cap sync android

      - name: Prepare Android signing keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ runner.temp }}/cricket-arena-release.keystore"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -alias cricketarena \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass cricketarena2026 \
              -keypass cricketarena2026 \
              -dname "CN=Cricket Arena, OU=Mobile, O=Cricket Arena, L=Local, S=NA, C=US"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=cricketarena2026" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=cricketarena" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=cricketarena2026" >> "$GITHUB_ENV"
          fi

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../CricketArena-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricketArena-release-apk
          path: CricketArena-release.apk
          retention-days: 90

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cricket Arena Android APK v1.0.${{ github.run_number }}
          body: |
            Installable signed Release APK for Cricket Arena.
            Download `CricketArena-release.apk` directly on your Android phone and open it to install.
          files: CricketArena-release.apk
